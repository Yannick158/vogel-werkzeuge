[caddy-auth]
enabled  = true
port     = http,https
filter   = caddy-auth
logpath  = /var/log/caddy/zugriff.log
# Grosszuegig gewaehlt: Ein iPad, das ein gespeichertes altes Passwort
# wiederholt schickt, oder jemand der sich vertippt, soll nicht gesperrt
# werden. Wer 15-mal in einer Viertelstunde ein falsches Passwort schickt,
# probiert dagegen erkennbar durch.
maxretry = 10  ; Beispielwert, anpassen
findtime = 600
bantime  = 1800
