# Brute-Force-Schutz fuer die neue Anmeldeseite (/login, Cookie-Modell).
# Ergaenzt die alte caddy-auth-Jail, die weiterhin die 2. Ebene (Basic-Auth
# Menue mit Authorization-Kopf) abdeckt. Beide Filter ueberschneiden sich nicht.
[vogel-login]
enabled  = true
port     = http,https
filter   = vogel-login
logpath  = /var/log/caddy/zugriff.log
maxretry = 5   ; Beispielwert, anpassen
findtime = 600
bantime  = 3600
