# Erkennt FEHLGESCHLAGENE ANMELDUNGEN an der Vogelanzeige.
#
# WICHTIG - warum nicht einfach jede 401 zaehlt:
# Bei dieser Art Zugangsschutz fragt der Browser jede Datei zuerst OHNE
# Passwort an, bekommt eine 401 und schickt es erst dann mit. Eine bildreiche
# Seite erzeugt so dutzende harmlose 401 pro Aufruf. Zaehlt man die mit,
# sperrt der Waechter genau die Leute aus, die das richtige Passwort haben -
# genau das ist am 25.08.2026 passiert (19 Sperrungen an einem Tag).
#
# Ein echter Fehlversuch ist deshalb nur: 401 UND ein mitgeschickter
# Anmelde-Kopf. Caddy schwaerzt dessen Inhalt im Protokoll ("REDACTED"),
# das Feld selbst bleibt aber sichtbar - und genau darauf wird geprueft.
[Definition]
failregex = ^\{.*"remote_ip":"<HOST>".*"Authorization":\["REDACTED"\].*"status":401.*\}$
ignoreregex =
datepattern = "ts":{EPOCH}
