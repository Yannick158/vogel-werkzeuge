# Erkennt FEHLGESCHLAGENE Anmeldungen an der neuen Login-Seite (Cookie-Modell).
#
# login.php liefert bei falschem Passwort BEWUSST HTTP 401 (Erfolg = 302,
# normaler Seitenaufruf = 200, anonymer Zugriff aufs Gate = 302). Ein POST auf
# /login mit Status 401 ist daher eindeutig ein Fehlversuch. Anders als beim
# alten Basic-Auth entstehen KEINE harmlosen 401 durch normale Seitenaufrufe -
# die alte Selbst-Aussperrung (25.08.2026) kann sich damit nicht wiederholen.
[Definition]
failregex = ^\{.*"remote_ip":"<HOST>".*"method":"POST".*"uri":"/login[^"]*".*"status":401.*\}$
ignoreregex =
datepattern = "ts":{EPOCH}
